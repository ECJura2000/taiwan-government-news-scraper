name: Build and release Rust apps

on:
  workflow_dispatch:
  push:
    tags: ["v2.1.6"]

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release intent
    runs-on: ubuntu-22.04
    steps:
      - name: Require manual publication from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the v2.1.6 workspace version
        shell: bash
        run: test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)" = "2.1.6"

  source-health:
    name: Gate all 72 live sources
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Tauri and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-source-health-${{ runner.os }}
      - name: Verify version and run live gate
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test "$version" = "2.1.6"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          mkdir -p source-health/output source-health/reports
          cargo run --release --bin news-scraper -- collect \
            --output-dir source-health/output \
            --report-dir source-health/reports \
            --max-workers 8 | tee source-health/summary.jsonl
          report="$(find source-health/reports -name 'news_scraper_run_*.json' -type f | sort | tail -n 1)"
          jq -e '.report_schema_version == 4 and .selected_source_count == 72 and (.news_count > 0) and (.quality.alert_reasons | length == 0)' "$report"
          jq -e '[.source_diagnostics[] | select(.status == "failed") | .failure_class] | all(. == "source_outage" or . == "runner_network" or . == "tls_certificate")' "$report"
          cp "$report" source-health/source-health-report.json
          mkdir -p source-health/retries
          jq -r '.failed_sources[]' "$report" | while IFS= read -r source; do
            safe_name="$(printf '%s' "$source" | sha256sum | cut -c1-12)"
            mkdir -p "source-health/retries/$safe_name/output" "source-health/retries/$safe_name/reports"
            set +e
            cargo run --release --bin news-scraper -- collect \
              --sources "$source" \
              --output-dir "source-health/retries/$safe_name/output" \
              --report-dir "source-health/retries/$safe_name/reports" \
              --fail-on-source-error | tee "source-health/retries/$safe_name/summary.jsonl"
            retry_exit="${PIPESTATUS[0]}"
            set -e
            retry_report="$(find "source-health/retries/$safe_name/reports" -name 'news_scraper_run_*.json' -type f | sort | tail -n 1)"
            test -n "$retry_report"
            jq -e '.selected_source_count == 1 and (.quality.alert_reasons | length == 0)' "$retry_report"
            jq -e '[.source_diagnostics[] | select(.status == "failed") | .failure_class] | all(. == "source_outage" or . == "runner_network" or . == "tls_certificate")' "$retry_report"
            jq -n \
              --arg source "$source" \
              --argjson exit_code "$retry_exit" \
              --slurpfile report "$retry_report" \
              '{source: $source, exit_code: $exit_code, retry_status: $report[0].status, failed_sources: $report[0].failed_sources, failure_class_counts: $report[0].failure_class_counts}' \
              > "source-health/retries/$safe_name/retry-evidence.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-source-health
          path: source-health/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            platform: linux
            cli: news-scraper
          - os: windows-latest
            label: Windows
            platform: windows
            cli: news-scraper.exe
          - os: macos-15
            label: macOS Apple Silicon
            platform: macos-arm64
            cli: news-scraper
          - os: macos-15-intel
            label: macOS Intel
            platform: macos-x64
            cli: news-scraper
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-build-${{ runner.os }}-${{ matrix.platform }}
      - run: npm ci
      - name: Build Rust CLI and Tauri GUI
        shell: bash
        run: |
          cargo build --release --bin news-scraper
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            npm run tauri build -- --bundles nsis
          else
            npm run tauri build
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            app_bundle="$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
            test -n "$app_bundle"
            codesign --force --deep --sign - "$app_bundle"
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
          fi
          "target/release/${{ matrix.cli }}" --version
          test "$("target/release/${{ matrix.cli }}" list-sources | wc -l | tr -d ' ')" = 72
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -s target/release/taiwan-government-news.exe
          fi
      - name: Smoke Windows portable GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gui = Resolve-Path "target/release/taiwan-government-news.exe"
          $readyFile = Join-Path $env:RUNNER_TEMP "taiwan-government-news-gui-ready.txt"
          Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          $env:NEWS_SCRAPER_UI_READY_FILE = $readyFile
          $process = Start-Process -FilePath $gui -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Portable Tauri GUI exited during startup with code $($process.ExitCode)"
              }
              if ((Test-Path $readyFile) -and ((Get-Content $readyFile -Raw).Trim() -eq "ready")) {
                break
              }
            } while ((Get-Date) -lt $deadline)
            if (-not (Test-Path $readyFile) -or ((Get-Content $readyFile -Raw).Trim() -ne "ready")) {
              throw "Portable Tauri GUI process stayed alive but the Svelte interface did not render"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          }
      - name: Stage portable archive
        shell: bash
        run: |
          tag="v2.1.6"
          root="taiwan-government-news-${tag}-${{ matrix.platform }}"
          mkdir -p "release-assets/$root/installers"
          cp "target/release/${{ matrix.cli }}" "release-assets/$root/"
          cp docs/PORTABLE_README.txt "release-assets/$root/README.txt"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            find target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} "release-assets/$root/installers/" \;
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/taiwan-government-news.exe "release-assets/$root/TaiwanGovernmentNews-GUI.exe"
            cp packaging/windows/START-GUI.cmd "release-assets/$root/START-GUI.cmd"
            find target/release/bundle/nsis -type f -name '*.exe' -exec cp {} "release-assets/$root/installers/" \;
            test -s "release-assets/$root/TaiwanGovernmentNews-GUI.exe"
            test -s "release-assets/$root/START-GUI.cmd"
          else
            app_bundle="$(find target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
            test -n "$app_bundle"
            ditto "$app_bundle" "release-assets/$root/installers/$(basename "$app_bundle")"
            codesign --verify --deep --strict --verbose=2 "release-assets/$root/installers/$(basename "$app_bundle")"
          fi
          test -n "$(find "release-assets/$root/installers" -type f -print -quit)"
          if find "release-assets/$root" -type f | grep -Eiq '(\.pyc?$|python|pyinstaller|openpyxl|selenium)'; then
            echo "Archive contains a forbidden Python runtime or package" >&2
            exit 1
          fi
      - name: Create ZIP on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "release-assets/taiwan-government-news-v2.1.6-${{ matrix.platform }}" -DestinationPath "release-assets/taiwan-government-news-v2.1.6-${{ matrix.platform }}.zip"
      - name: Create ZIP on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cd release-assets && zip -qr "taiwan-government-news-v2.1.6-${{ matrix.platform }}.zip" "taiwan-government-news-v2.1.6-${{ matrix.platform }}"
      - name: Create ZIP on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: cd release-assets && ditto -c -k --sequesterRsrc --keepParent "taiwan-government-news-v2.1.6-${{ matrix.platform }}" "taiwan-government-news-v2.1.6-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-${{ matrix.platform }}
          path: release-assets/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish v2.1.6
    needs: [source-health, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-bundle-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and build manifests
        shell: bash
        run: |
          for platform in linux windows macos-arm64 macos-x64; do
            archive="release-assets/taiwan-government-news-v2.1.6-${platform}.zip"
            test -s "$archive"
            if unzip -l "$archive" | grep -Eiq '(\.pyc?$|python|pyinstaller|openpyxl|selenium)'; then
              echo "$archive contains forbidden Python content" >&2
              exit 1
            fi
            if [[ "$platform" == "windows" ]]; then
              unzip -Z1 "$archive" | grep -Eq '/TaiwanGovernmentNews-GUI\.exe$'
              unzip -Z1 "$archive" | grep -Eq '/START-GUI\.cmd$'
            fi
            if [[ "$platform" == macos-* ]]; then
              app_path="$(find "release-assets/taiwan-government-news-v2.1.6-${platform}/installers" -maxdepth 1 -type d -name '*.app' -print -quit)"
              test -n "$app_path"
              codesign --verify --deep --strict --verbose=2 "$app_path"
            fi
          done
          cd release-assets
          sha256sum -- *.zip > taiwan-government-news-v2.1.6-SHA256SUMS.txt
          for file in ./*.zip; do
            printf '%s bytes  %s\n' "$(stat -c %s "$file")" "${file#./}"
          done > taiwan-government-news-v2.1.6-SIZE-MANIFEST.txt
      - name: Refuse to overwrite v2.0.0 or an existing v2.1.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          if gh release view v2.1.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.1.6 already exists; refusing to overwrite it" >&2
            exit 1
          fi
      - name: Publish immutable Rust release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v2.1.6 ]]; then
            tag_args=(--verify-tag)
          else
            tag_args=(--target "$GITHUB_SHA")
          fi
          gh release create v2.1.6 release-assets/*.zip release-assets/*.txt \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_args[@]}" \
            --generate-notes \
            --title "各機關新聞整理 v2.1.6" \
            --notes "完整 Rust 取代版的 CI 與封裝維護版。PR/main 檢查已改為快取加速的 Rust quality、Svelte/TypeScript 與 Linux Tauri smoke；完整 Linux、Windows、macOS Apple Silicon、macOS Intel 打包仍保留在 release workflow。macOS ZIP 內改附 ad-hoc-signed .app bundle 並由 codesign 驗證，避免再次發布先前會被判定損毀的 DMG。Windows ZIP 仍包含 portable GUI、START-GUI.cmd、CLI 與 NSIS 安裝檔。"
