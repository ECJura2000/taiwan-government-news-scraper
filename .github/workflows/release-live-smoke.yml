name: Release live smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Rust release tag to verify
        required: true
        default: v2.1.18
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            cli: news-scraper
          - os: windows-latest
            platform: windows
            cli: news-scraper.exe
          - os: macos-15
            platform: macos-arm64
            cli: news-scraper
          - os: macos-15-intel
            platform: macos-x64
            cli: news-scraper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download and verify published Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $archive = "taiwan-government-news-$env:RELEASE_TAG-windows-portable.zip"
          $installer = "TaiwanGovernmentNews-Setup-$env:RELEASE_TAG.exe"
          $checksums = "taiwan-government-news-$env:RELEASE_TAG-SHA256SUMS.txt"
          New-Item -ItemType Directory -Force release-download, extracted | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir release-download --pattern $archive --pattern $installer --pattern $checksums

          foreach ($file in @($archive, $installer)) {
            $line = Get-Content (Join-Path release-download $checksums) | Where-Object { $_.EndsWith("  $file") } | Select-Object -First 1
            if (-not $line) {
              throw "Missing checksum entry for $file"
            }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash (Join-Path release-download $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $file"
            }
          }

          Expand-Archive -LiteralPath (Join-Path release-download $archive) -DestinationPath extracted -Force
          $entries = Get-ChildItem extracted -Recurse -File
          $forbidden = $entries | Where-Object { $_.FullName -match '(\.pyc?$|python|pyinstaller|openpyxl|selenium|START-GUI|TaiwanGovernmentNews-GUI)' } | Select-Object -First 1
          if ($forbidden) {
            throw "Forbidden legacy Windows launcher or Python content found: $($forbidden.FullName)"
          }
          $cli = $entries | Where-Object { $_.Name -eq 'news-scraper.exe' -and $_.FullName -match '[\\/]cli[\\/]' } | Select-Object -First 1
          if (-not $cli) {
            throw "CLI is missing from the extracted Windows archive"
          }
          $gui = $entries | Where-Object { $_.Extension -eq '.exe' -and $_.Name -ne 'news-scraper.exe' -and $_.FullName -notmatch '[\\/]cli[\\/]' } | Select-Object -First 1
          if (-not $gui) {
            throw "Portable GUI is missing from the extracted Windows archive"
          }
          "CLI_PATH=$($cli.FullName)" >> $env:GITHUB_ENV
          "GUI_PATH=$($gui.FullName)" >> $env:GITHUB_ENV

      - name: Download and verify published archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          archive="taiwan-government-news-${RELEASE_TAG}-${{ matrix.platform }}.zip"
          checksums="taiwan-government-news-${RELEASE_TAG}-SHA256SUMS.txt"
          mkdir -p release-download extracted
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-download --pattern "$archive" --pattern "$checksums"
          (cd release-download && grep "  ${archive}$" "$checksums" | sha256sum -c -)
          unzip -q "release-download/$archive" -d extracted
          listing="$(unzip -Z1 "release-download/$archive")"
          if grep -Ei '(\.pyc?$|python|pyinstaller|openpyxl|selenium|START-GUI|TaiwanGovernmentNews-GUI)' <<< "$listing" >/dev/null; then exit 1; fi
          cli="$(find extracted -type f -name '${{ matrix.cli }}' -print -quit)"
          test -n "$cli"
          chmod +x "$cli"
          echo "CLI_PATH=$cli" >> "$GITHUB_ENV"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            app_bundle="$(find extracted -maxdepth 2 -type d -name '*.app' -print -quit)"
            test -n "$app_bundle"
            test -x "$(find "$app_bundle/Contents/MacOS" -maxdepth 1 -type f -name 'taiwan-government-news' -print -quit)"
            test -s "$(find extracted -maxdepth 2 -type f -name '*.command' -print -quit)"
          fi
      - name: Run Windows portable GUI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path $env:GUI_PATH)) {
            throw "Portable GUI is missing from the extracted Windows archive"
          }
          $readyFile = Join-Path $env:RUNNER_TEMP "taiwan-government-news-release-gui-ready.txt"
          Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          $env:NEWS_SCRAPER_UI_READY_FILE = $readyFile
          $process = Start-Process -FilePath $env:GUI_PATH -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Extracted portable GUI exited during startup with code $($process.ExitCode)"
              }
              if ((Test-Path $readyFile) -and ((Get-Content $readyFile -Raw).Trim() -eq "ready")) {
                break
              }
            } while ((Get-Date) -lt $deadline)
            if (-not (Test-Path $readyFile) -or ((Get-Content $readyFile -Raw).Trim() -ne "ready")) {
              throw "Extracted GUI process stayed alive but the Svelte interface did not render"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          }
      - name: Run Rust CLI smoke
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$("$CLI_PATH" --version)" = "news-scraper ${RELEASE_TAG#v}"
          test "$("$CLI_PATH" list-sources | wc -l | tr -d ' ')" = 88
          mkdir -p live-output live-reports
          "$CLI_PATH" collect --sources 財政部 --output-dir live-output --report-dir live-reports --fail-on-source-error | tee live-summary.jsonl
          report="$(find live-reports -name 'news_scraper_run_*.json' -type f | sort | tail -n 1)"
          jq -e '.report_schema_version == 4 and .selected_source_count == 1 and (.failed_sources | length == 0)' "$report"
          node --input-type=module - "$report" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const reportPath = process.argv[2];
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const latest = JSON.parse(fs.readFileSync(path.join(path.dirname(reportPath), 'latest_run.json'), 'utf8'));
          const complete = JSON.parse(fs.readFileSync(report.completion_file, 'utf8'));
          if (JSON.stringify(latest) !== JSON.stringify(complete) || report.run_id !== latest.run_id || path.resolve(reportPath) !== path.resolve(latest.report_file) || report.output_file !== latest.output_file) throw Error('Run pair mismatch');
          for (const [file, hash] of [['output_file', 'excel_sha256'], ['report_file', 'report_sha256']]) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(latest[file])).digest('hex');
            if (actual !== latest[hash]) throw Error(`Checksum mismatch: ${file}`);
          }
          console.log(`Verified completed run ${report.run_id}`);
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-live-smoke-${{ inputs.tag }}-${{ matrix.platform }}
          path: |
            live-summary.jsonl
            live-output/
            live-reports/
          if-no-files-found: warn
          retention-days: 7
