name: Rust quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rust-quality-${{ runner.os }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify the exact approved source catalog
        shell: bash
        run: |
          cargo run --quiet --bin news-scraper -- list-sources > sources.txt
          node scripts/check-source-catalog.mjs sources.txt
      - name: Reject legacy Python runtime and scraper code
        shell: bash
        run: |
          test -f scripts/python_compat.py
          test "$(git ls-files '*.py')" = "scripts/python_compat.py"
          test ! -e news_scraper
          test ! -e pyproject.toml
          test -z "$(find . -maxdepth 1 \( -name 'requirements*' -o -name '*.spec' \) -print)"
      - name: Dependency audits
        run: |
          cargo install cargo-audit --locked
          node scripts/audit-dependencies.mjs
          npm audit --audit-level=high
