name: Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps -e .
      - run: python -m compileall -q news_scraper
      - run: python -m pytest -q --cov=news_scraper --cov-report=term --cov-report=json:coverage-package.json
      - run: python scripts/check_coverage.py coverage-package.json

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m mypy

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - run: python scripts/benchmark_capacity.py --sizes 1000 10000 --workers 1 4 16 > benchmark-results.json
      - run: python scripts/check_benchmark_budget.py benchmark-results.json benchmarks/baseline.json
      - run: python scripts/benchmark_excel_export.py --rows 10000 --max-seconds 30 > excel-benchmark-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: taiwan-news-benchmark-results
          path: |
            benchmark-results.json
            excel-benchmark-results.json
          retention-days: 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --require-hashes -r requirements-security.lock.txt
          python -m pip install --no-deps -e .
      - run: python -m pip_audit -r requirements.lock.txt --require-hashes
      - run: python -m bandit -q -ll -r news_scraper scripts -x tests
      - run: python scripts/check_workflows.py
