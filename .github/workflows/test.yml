name: Rust quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify all 72 sources are catalogued
        shell: bash
        run: |
          cargo run --quiet --bin news-scraper -- list-sources > sources.txt
          test "$(wc -l < sources.txt | tr -d ' ')" = 72
      - name: Reject legacy Python runtime and scraper code
        shell: bash
        run: |
          test -f scripts/python_compat.py
          test "$(git ls-files '*.py')" = "scripts/python_compat.py"
          test ! -e news_scraper
          test ! -e pyproject.toml
          test -z "$(find . -maxdepth 1 \( -name 'requirements*' -o -name '*.spec' \) -print)"
      - name: Dependency audits
        run: |
          cargo install cargo-audit --locked
          cargo audit
          npm audit --audit-level=high
