name: Rust quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: rust-quality-${{ runner.os }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify all 88 sources are catalogued
        shell: bash
        run: |
          cargo run --quiet --bin news-scraper -- list-sources > sources.txt
          test "$(wc -l < sources.txt | tr -d ' ')" = 88
      - name: Reject legacy Python runtime and scraper code
        shell: bash
        run: |
          test -f scripts/python_compat.py
          test "$(git ls-files '*.py')" = "scripts/python_compat.py"
          test ! -e news_scraper
          test ! -e pyproject.toml
          test -z "$(find . -maxdepth 1 \( -name 'requirements*' -o -name '*.spec' \) -print)"
      - name: Dependency audits
        run: |
          cargo install cargo-audit --locked
          node scripts/audit-dependencies.mjs
          npm audit --audit-level=high
