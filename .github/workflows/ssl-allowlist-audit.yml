name: SSL allowlist audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 20 * * 3"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps -e .
      - name: Probe candidate hosts with verified TLS
        run: >-
          python scripts/audit_ssl_allowlist.py
          --candidates benchmarks/ssl-removal-candidates.json
          --output ssl-audit/github-runner.json
          --environment github-runner
      - name: Write audit summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("ssl-audit/github-runner.json")
          if not path.exists():
              print("SSL audit evidence was not produced.")
              raise SystemExit()
          report = json.loads(path.read_text(encoding="utf-8"))
          print("# SSL allowlist audit")
          print()
          print("- Successful verified TLS: {}/{}".format(report["success_count"], report["candidate_count"]))
          print()
          print("| Host | Verified TLS | HTTP status | Error |")
          print("| --- | --- | ---: | --- |")
          for item in report["results"]:
              print("| {} | {} | {} | {} |".format(
                  item["host"],
                  "yes" if item["success"] else "no",
                  item["status_code"] or "",
                  str(item["error"]).replace("|", "\\|"),
              ))
          PY
      - name: Upload SSL audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ssl-allowlist-audit
          path: ssl-audit/
          if-no-files-found: warn
          retention-days: 7
