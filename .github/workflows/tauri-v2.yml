name: Tauri v2 application

on:
  pull_request:
    paths:
      - ".github/workflows/tauri-v2.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "*.ts"
      - "*.js"
      - "index.html"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tauri-v2.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "*.ts"
      - "*.js"
      - "index.html"

permissions:
  contents: read

jobs:
  frontend:
    name: Svelte and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  bundle:
    name: Build ${{ matrix.label }}
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-22.04
            artifact: tauri-linux
          - label: Windows
            os: windows-latest
            artifact: tauri-windows
          - label: macOS Apple Silicon
            os: macos-15
            artifact: tauri-macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            artifact: tauri-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Build Windows NSIS bundle
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Smoke Windows portable GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gui = Resolve-Path "target/release/taiwan-government-news.exe"
          $process = Start-Process -FilePath $gui -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Portable Tauri GUI exited during startup with code $($process.ExitCode)"
              }
              if ($process.MainWindowTitle -like "*介面就緒*") {
                break
              }
            } while ((Get-Date) -lt $deadline)
            if ($process.MainWindowTitle -notlike "*介面就緒*") {
              throw "Portable Tauri GUI process stayed alive but the Svelte interface did not render"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Build Tauri bundle
        if: runner.os != 'Windows'
        run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/**
          if-no-files-found: error
