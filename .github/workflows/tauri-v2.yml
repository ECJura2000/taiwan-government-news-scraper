name: Tauri v2 application

on:
  pull_request:
    paths:
      - ".github/workflows/tauri-v2.yml"
      - ".github/workflows/build-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "*.ts"
      - "*.js"
      - "index.html"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tauri-v2.yml"
      - ".github/workflows/build-release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "*.ts"
      - "*.js"
      - "index.html"

permissions:
  contents: read

jobs:
  frontend:
    name: Svelte and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: tauri-v2-rust-quality-${{ runner.os }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  linux-smoke:
    name: Build Linux Tauri smoke
    needs: [frontend, rust]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: tauri-v2-linux-smoke-${{ runner.os }}
      - name: Build Linux Tauri bundle smoke
        run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-linux-smoke
          path: |
            target/release/bundle/**
          if-no-files-found: error
