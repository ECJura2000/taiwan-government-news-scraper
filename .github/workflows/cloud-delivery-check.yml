name: Cloud delivery contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node --test scripts/cloud-delivery.checks.mjs
      - run: bash -n scripts/upload-cloud-drive.sh
