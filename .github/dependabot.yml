version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    # svelte-check currently accepts TypeScript 5/6; lift when its peer range supports 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
