[package]
name = "taiwan-government-news"
version.workspace = true
description = "Taiwan government news scraper desktop application"
authors = ["ECJura2000"]
edition.workspace = true
default-run = "taiwan-government-news"

[lib]
name = "taiwan_government_news_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures = "0.3"
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "native-tls"] }
rust_xlsxwriter = "0.99"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
url = "2"

[dev-dependencies]
tempfile = "3"
