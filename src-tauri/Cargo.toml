[package]
name = "taiwan-government-news"
version.workspace = true
description = "Taiwan government news scraper desktop application"
authors = ["ECJura2000"]
edition.workspace = true

[lib]
name = "taiwan_government_news_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time"] }
url = "2"
